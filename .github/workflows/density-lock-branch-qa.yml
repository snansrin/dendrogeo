name: Density Lock Branch QA

on:
  push:
    branches:
      - fix/density-single-source-lock

permissions:
  contents: write

jobs:
  qa:
    name: Final density lock guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Sync content hashes
        run: node scripts/version-sync.mjs --write

      - name: Rebuild index
        run: npm run build

      - name: Commit deterministic generated files
        run: |
          git config user.name "DendroGeo QA Bot"
          git config user.email "qa@dendrogeo.local"
          git add partials/head.html index.html
          if git diff --cached --quiet; then
            echo "generated files already current"
          else
            git commit -m "build: sync immutable density lock asset hashes"
            git push origin HEAD:fix/density-single-source-lock
          fi

      - name: Full guard chain
        run: npm run check
