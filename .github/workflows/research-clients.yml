name: Research client packages

on:
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "research/**"
      - "papers/tools/**"
      - "scripts/check-carbon-reference.mjs"
      - "test/fixtures/carbon-reference-v1.json"
      - "src/config/species.js"
      - "src/config/wood-density-lock.js"
      - "src/config/measurement-protocol-lock.js"
      - "src/domain/trees/allometry.js"
      - "src/application/trees/calculate-tree-carbon*.js"
      - "scripts/lib/mc.mjs"
      - ".github/workflows/research-clients.yml"
  pull_request:
    paths:
      - "clients/**"
      - "research/**"
      - "papers/tools/**"
      - "scripts/check-carbon-reference.mjs"
      - "test/fixtures/carbon-reference-v1.json"
      - "src/config/species.js"
      - "src/config/wood-density-lock.js"
      - "src/config/measurement-protocol-lock.js"
      - "src/domain/trees/allometry.js"
      - "src/application/trees/calculate-tree-carbon*.js"
      - "scripts/lib/mc.mjs"
      - ".github/workflows/research-clients.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-reference:
    name: Independent carbon reference and uncertainty diagnostics
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare production arithmetic with independent Python reference
        run: node scripts/check-carbon-reference.mjs
      - name: Check paired validation and separated uncertainty diagnostics
        run: python -m unittest discover -s research/tests -v

  python:
    name: Python DGR client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install package
        run: python -m pip install ./clients/python
      - name: Run client tests
        run: python -m unittest discover -s clients/python/tests -v

  r:
    name: R DGR client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: clients/r/dendrogeo
          extra-packages: any::rcmdcheck
      - name: Check R package
        run: Rscript -e 'rcmdcheck::rcmdcheck("clients/r/dendrogeo", args = c("--no-manual"), error_on = "error")'

  papers-tools:
    name: Manuscript audit tools (synthetic fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s papers/tools -p "test_*.py" -t papers/tools -v
