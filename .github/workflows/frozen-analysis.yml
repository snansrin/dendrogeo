name: Frozen r90 analysis
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  frozen-analysis:
    name: Frozen r90 analysis gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute only the trusted base script, never code from the proposed PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare candidate files against frozen r90 and trusted base
        env:
          DG_LOCK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DG_LOCK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$DG_LOCK_HEAD_SHA"
          node scripts/check-frozen-analysis.mjs "$DG_LOCK_BASE_SHA" "$DG_LOCK_HEAD_SHA"
