name: Rapor DOI kaydı
on:
  workflow_dispatch:
    inputs:
      report_id:
        description: 'Yayımlanmış rapor kimliği (DGR-YYYY-NNNN)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: rapor-yayin-kuyrugu
  cancel-in-progress: false
jobs:
  doi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Zenodo kaydı ve DOI
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          REPORT_ID: ${{ inputs.report_id }}
        run: node scripts/register-doi.mjs "$REPORT_ID" --publish
      - name: Kayıt durumunu sakla
        if: always()
        run: |
          git config user.name "DendroGeo Rapor Bot"
          git config user.email "bot@dendrogeo.local"
          git add rapor/
          if ! git diff --cached --quiet; then
            git commit -m "Rapor DOI kayıt durumu"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
