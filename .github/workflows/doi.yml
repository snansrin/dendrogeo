name: Rapor DOI kaydı
on:
  workflow_dispatch:
    inputs:
      report_id:
        description: 'Yayımlanmış rapor kimliği (DGR-YYYY-NNNN)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: rapor-yayin-kuyrugu
  cancel-in-progress: false
jobs:
  doi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Zenodo kaydı ve DOI
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          REPORT_ID: ${{ inputs.report_id }}
        run: node scripts/register-doi.mjs "$REPORT_ID" --publish
      - name: Kayıt durumunu sakla
        if: always()
        env:
          REPORT_ID: ${{ inputs.report_id }}
        run: |
          if [[ ! "$REPORT_ID" =~ ^DGR-[0-9]{4}-[0-9]{4}$ ]]; then
            echo "Geçersiz rapor kimliği; kayıt dosyaları işlenmedi."
            exit 2
          fi
          git config user.name "DendroGeo Rapor Bot"
          git config user.email "bot@dendrogeo.local"
          state="rapor/$REPORT_ID/zenodo-deposit.json"
          record="rapor/$REPORT_ID/doi.json"
          [[ -f "$state" ]] && git add "$state"
          [[ -f "$record" ]] && git add "$record"
          if ! git diff --cached --quiet; then
            git commit -m "Rapor yayın kayıt durumunu sakla"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
