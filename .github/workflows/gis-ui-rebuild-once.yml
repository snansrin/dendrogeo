name: GIS UI one-time build
on:
  push:
    branches: [fix/gis-ui-png-ndvi-mobile-20261008]
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Rebuild generated index and verify source lock, tests and asset versions
        run: |
          npm run build
          npm run check
      - name: Commit built index and remove this temporary workflow
        run: |
          git config user.name "DendroGeo GIS UI Build"
          git config user.email "gis-ui-build@users.noreply.github.com"
          git rm .github/workflows/gis-ui-rebuild-once.yml
          git add index.html
          git commit -m "build(gis-ui): synchronized index and asset hashes [skip ci]"
          git push origin HEAD:fix/gis-ui-png-ndvi-mobile-20261008
