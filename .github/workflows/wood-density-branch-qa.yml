name: Wood density branch QA

on:
  push:
    branches: [fix/wood-density-lock-sigla]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wood-density-lock-sigla

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose checkout test set
        run: |
          echo "checkout:"; ls -l test/change-summary.test.mjs 2>/dev/null || true
          if [ -f test/change-summary.test.mjs ]; then sed -n '1,220p' test/change-summary.test.mjs; fi

      - name: Install dependencies
        run: npm ci

      - name: Diagnose after npm ci
        run: |
          echo "after npm ci:"; ls -l test/change-summary.test.mjs 2>/dev/null || true
          if [ -f test/change-summary.test.mjs ]; then sed -n '1,220p' test/change-summary.test.mjs; fi

      - name: Generate deterministic index artifact
        run: npm run build

      - name: Diagnose after build
        run: |
          echo "after build:"; ls -l test/change-summary.test.mjs 2>/dev/null || true
          if [ -f test/change-summary.test.mjs ]; then sed -n '1,220p' test/change-summary.test.mjs; fi

      - name: Commit generated index before guards
        run: |
          git config user.name "DendroGeo QA Bot"
          git config user.email "qa-bot@dendrogeo.local"
          git add index.html
          if git diff --cached --quiet; then
            echo "Generated index is already current."
          else
            git commit -m "build: refresh content hashes for density lock"
            git push origin HEAD:fix/wood-density-lock-sigla
          fi

      - name: Run complete repository guards
        run: npm run check
