name: Rapor Kuyruğu Kalp Atışı

# 0016 (2026-09-28 · kullanıcı: "push etmezsek hiçbir şey çalışmıyor — adam
# gibi sistem kur"): KENDİ KENDİNİ SÜREN yayın/geri çekme kuyruğu.
#
# GitHub schedule pratikte GÜVENİLMEZ (bu depoda gözlem: '*/5' cron 20 saatte
# 4 kez tetiklendi). Çözüm üç bacalı:
#
#   1) ZİNCİR (esas): her koşu — iş yapsın ya da yapmasın — bittiği anda bir
#      sonrakini repository_dispatch ile kendisi tetikler (~5 dk aralık).
#      Zincir koşuların kendisinden beslenir; GitHub cron'una bağımlı DEĞİL.
#   2) YEDEKLER: '*/5' cron + 6 saatte bir yeniden-arme cron + her main
#      push'unda CI 'kuyruk' işi (0013) + rapor-yayin koşuları zinciri
#      yeniden tetikler. Zincir herhangi bir nedenle kırılırsa en geç 6 saatte
#      KENDİLİĞİNDEN dirilir.
#   Ritim (0019): kalp tetiklendiğinde BEKLEMEZ, hemen bakar; ritmi cron
#   ('*/5') + zincir tetikleri birlikte ~5 dk'da tutar. Boşta maliyet
#   ~15-20 sn olduğundan sık koşu zararsızdır (public repo: dakika sınırı
#   yok). 'Beklemede' süresi fiilen bir tetik aralığıdır (≤ ~5-7 dk).
#   3) BOŞTA MALİYET ~15-20 sn: nabız önce YALNIZ HTTP ile kuyruğa bakar
#      (report_requests + report_retractions, anon okuma — 0008'den beri
#      anon'a açık). İş yoksa ağır üretim HİÇ koşmaz. İş varsa üretim
#      'Rapor Yayın Kuyruğu' workflow'una devredilir (onun concurrency
#      kilidi tek üreticiyi garanti eder → çift DGR imkânsız).
#
# Depo PUBLIC → standart runner dakikaları sınırsız; 5 dk'lık nabız maliyet
# sorunu değildir (aralığı değiştirmek için: zincir adımındaki 300 değeri).

on:
  repository_dispatch:
    types: [rapor-kuyruk-nabiz]
  schedule:
    - cron: '*/5 * * * *'      # GitHub tetiklerse ek güvence (zinciri de besler)
    - cron: '17 */6 * * *'     # zincir koptuysa 6 saatte bir yeniden-arme
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write               # zincir: kendi ardılını tetikler

concurrency:
  group: rapor-kalp
  cancel-in-progress: false

jobs:
  nabiz:
    runs-on: ubuntu-latest
    timeout-minutes: 8    # 0019: zincir adımı sleep 300 + kontroller ~5,5 dk; payıyla 8 dk
    steps:
      - uses: actions/checkout@v4   # sığ klon yeter: günlük + supabase.js

      - name: "Zincir İLK iş — ardıl nabız (0019)"
        if: always()
        run: |
          # 0019 · dört dersin toplamı (hepsi canlı kanıtlı):
          #  0016: gecikmeli dispatch HİÇ koşmadı → anlık repository_dispatch.
          #  0017: bekçi döngüsü iş timeoutunda boğuldu → iş timeout 8 dk,
          #      adım bütçesi ~5,5 dk (sleep 300 + kısa kontroller).
          #  0018a: zincir SON adımdaydı → iş adımı patlayınca zincir ölüyordu
          #      → zincir İLK adımda (if: always) kurulur, iş sonra patlasın.
          #  0018b: 4 dk'lık İKİ YÖNLÜ bekçi 12:57'de çatal ölümü yaptı (cron
          #      + CI 26 sn arayla iki koşu; ikisi de 'o devralır' deyip sustu
          #      → 2 saat kopuk). Kural: susma YALNIZCA kendinden YENİ bir
          #      kalp koşusu varsa (o, zinciri kesin kuracak — uykusu bizden
          #      sonra bitiyor); eskiler susturmaz. Ya hep zincir, ya devir.
          sleep 300 || true
          API="${{ github.api_url }}/repos/${{ github.repository }}"
          AUTH="Authorization: Bearer ${{ github.token }}"
          ACC="Accept: application/vnd.github+json"
          WF=$(curl -sf -H "$AUTH" -H "$ACC" "$API/actions/workflows" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const w=(JSON.parse(s).workflows||[]).find(x=>String(x.path).endsWith("rapor-kalp.yml"));console.log(w?w.id:"")}catch(e){console.log("")}})')
          if [ -z "$WF" ]; then echo "⚠ workflow kimliği yok — cron/push yedeği devralır"; exit 0; fi
          NEWER=$(curl -sf -H "$AUTH" -H "$ACC" "$API/actions/workflows/$WF/runs?per_page=15&exclude_current=true" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=Date.now();try{const r=(JSON.parse(s).workflow_runs||[]).filter(x=>x.created_at&&(t-new Date(x.created_at).getTime())<240000);console.log(r.length)}catch(e){console.log(0)}})')
          if [ "$NEWER" -ge 1 ] 2>/dev/null; then
            echo "🫀 son 4 dk'da BENDEN YENİ $NEWER kalp koşusu var — zinciri o kuracak (uykusu sonra bitiyor), bu koşu susuyor"
            exit 0
          fi
          curl -sf -X POST -H "$AUTH" -H "$ACC" "$API/dispatches" \
            -d '{"event_type":"rapor-kuyruk-nabiz","client_payload":{"chain":"${{ github.run_id }}"}}' \
            && echo "🔗 ardıl nabız anlık tetiklendi — zincir sürüyor" \
            || echo "⚠ tetik gönderilemedi — cron (*/5) ve 6 saatlik re-arm yedeği devralır"

      - name: Kuyrukta iş var mı? (yalnız HTTP — boşta koşu hızlı biter)
        id: kontrol
        run: |
          set -e
          SB_URL=$(sed -n 's/.*SB_URL="\([^"]*\)".*/\1/p' src/config/supabase.js)
          SB_KEY=$(sed -n 's/.*SB_KEY="\([^"]*\)".*/\1/p' src/config/supabase.js)
          REQ=$(curl -sf -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/report_requests?status=eq.Beklemede&select=id" || echo '[]')
          RET=$(curl -sf -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/report_retractions?status=eq.Beklemede&select=id,report_id" || echo '[]')
          node -e '
            const fs = require("fs");
            const reqS = process.argv[1], retS = process.argv[2];
            let reqs = [], rets = [], log = { entries: [] };
            try { reqs = JSON.parse(reqS); } catch (e) {}
            try { rets = JSON.parse(retS); } catch (e) {}
            try { log = JSON.parse(fs.readFileSync("rapor/yayin-kuyrugu.json", "utf8")); } catch (e) {}
            const doneReq = new Set((log.entries || []).map((e) => String(e.request_id)));
            const doneRet = new Set((log.entries || []).filter((e) => e.status === "Geri çekildi").map((e) => String(e.retraction_id)));
            const pendReq = reqs.filter((r) => !doneReq.has(String(r.id))).length;
            const pendRet = rets.filter((r) => !doneRet.has(String(r.id))).length;
            const work = pendReq + pendRet;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "work=" + work + "\npend_req=" + pendReq + "\npend_ret=" + pendRet + "\n");
            console.log("bekleyen: " + pendReq + " yayın isteği, " + pendRet + " geri çekme → " + (work > 0 ? "ÜRETİM KOŞACAK" : "boşta (üretim atlanır)"));
          ' "$REQ" "$RET"

      - name: Üretim kilitli mi? (rapor-yayin veya CI kuyruk işi koşuyorsa bekle)
        if: steps.kontrol.outputs.work != '0'
        id: kilit
        run: |
          set -e
          H='-H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json"'
          A=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs?status=in_progress&exclude_current=true&per_page=100" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.workflow_runs||[]).filter(r=>r.name==="Rapor Yayın Kuyruğu"||(r.name==="CI"&&(r.display_title||"").includes("kuyruk"))).length)}catch(e){console.log(0)}})')
          Q=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs?status=queued&exclude_current=true&per_page=100" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.workflow_runs||[]).filter(r=>r.name==="Rapor Yayın Kuyruğu").length)}catch(e){console.log(0)}})')
          echo "uretim_yuruyor=$((A + Q))" >> "$GITHUB_OUTPUT"
          echo "üretimde koşan/kuyruktaki ilgili iş: $((A + Q))"

      - name: Üretimi tetikle (Rapor Yayın Kuyruğu · workflow_dispatch)
        if: steps.kontrol.outputs.work != '0' && steps.kilit.outputs.uretim_yuruyor == '0'
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/rapor-yayin.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "✅ üretim tetiklendi: bekleyen ${{ steps.kontrol.outputs.pend_req }} yayın + ${{ steps.kontrol.outputs.pend_ret }} geri çekme"
