name: Waypoint Mobile Mainline QA
on:
  push:
    branches:
      - fix/waypoint-mobile-status
permissions:
  contents: read
jobs:
  qa:
    name: Full build and guard chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run check
