name: UI Final Branch QA
on:
  push:
    branches:
      - fix/ui-simplify-final
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - run: npm run build
      - name: Commit generated index
        run: |
          git config user.name "DendroGeo QA Bot"
          git config user.email "qa@dendrogeo.local"
          git add index.html
          if git diff --cached --quiet; then echo "index current"; else git commit -m "build: refresh index after final UI cleanup"; git push origin HEAD:fix/ui-simplify-final; fi
      - run: npm run check
