name: Waypoint presence one-time release build
on:
  push:
    branches: [fix/waypoint-presence-recovery-20261101]
    paths: [src/services/map.js, .github/workflows/waypoint-presence-rebuild-once.yml]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'snansrin/dendrogeo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Audit protected changed files (without modifying scientific data)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const digest=data=>createHash('sha256').update(data).digest('hex');
          const mp='docs/core-foundation-lock.json',vp='scripts/check-core-foundation.mjs';
          const manifest=JSON.parse(readFileSync(mp,'utf8'));
          const changed=[...new Set([...execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split('\n'),...execFileSync('git',['diff','--name-only','HEAD'],{encoding:'utf8'}).trim().split('\n')].filter(Boolean))];
          const records=[];
          for(const path of changed){
            if(!Object.hasOwn(manifest.sha256,path))continue;
            const latest=(manifest.authorized_modularizations||[]).flatMap(x=>x.files||[]).filter(f=>f.path===path).at(-1)?.sha256||manifest.sha256[path];
            const current=digest(readFileSync(path));
            if(current!==latest)records.push({path,previous_sha256:latest,sha256:current});
          }
          if(!records.length)throw Error('No audited protected change; refusing empty release');
          manifest.authorized_modularizations.push({
            date:'2026-11-01',audit_chain:'sha256-v1',
            scope:'User-approved Waypoint-only park Presence recovery: discard terminal and stale private channels, reconnect within the selected authorized park, extend connection timeout; preserve membership RLS, database, scientific formulas, carbon model, park geometry, raster, GPS consent and ten-second throttle.',
            validation:['npm run check','GitHub Chromium/WebKit mobile checks before merge'],files:records
          });
          writeFileSync(mp,JSON.stringify(manifest,null,2)+'\n');
          const validator=readFileSync(vp,'utf8');
          const next=validator.replace(/const MANIFEST_SHA256="[^"]+";/,'const MANIFEST_SHA256="'+digest(readFileSync(mp))+'";');
          if(validator===next)throw Error('Unable to refresh pinned manifest digest');
          writeFileSync(vp,next);
          NODE
      - name: Full regression and immutable-core gate
        run: npm run check
      - name: Commit only validated generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/core-foundation-lock.json scripts/check-core-foundation.mjs index.html src/bootstrap/app-runtime.js
          git diff --cached --check
          git commit -m "build: sync verified Waypoint Presence recovery and core audit"
          git push origin HEAD:fix/waypoint-presence-recovery-20261101
