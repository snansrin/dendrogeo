name: Mobile smoke
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Chromium
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done
          npx --yes --package=playwright@1.62.1 playwright install --with-deps chromium
      - name: Telefon, çizim ve OSM regresyonları
        run: npm run check:phone
      - name: Klavye, odak ve erişilebilirlik
        run: npm run check:accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-smoke
          path: /tmp/dendrogeo-mobile/
          retention-days: 7

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: WebKit
        run: |
          # The runner's Azure mirror can stall dependency downloads past the job limit.
          # Use Ubuntu's main archive with the existing suites and signature keys.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done
          npx --yes --package=playwright@1.62.1 playwright install --with-deps webkit
      - name: WebKit profil ve sekme regresyonları
        env:
          DG_UI_BROWSER: webkit
        run: |
          node scripts/landing-showcase-smoke.mjs
          node scripts/visitor-analytics-smoke.mjs
          node scripts/profile-smoke.mjs
          node scripts/projects-workspace-smoke.mjs
          node scripts/shared-park-surface-smoke.mjs
          node scripts/appearance-smoke.mjs
          node scripts/ui-consistency-smoke.mjs
          node scripts/mobile-tools-language-smoke.mjs
          node scripts/measurement-save-smoke.mjs
          node scripts/park-analysis-interaction-smoke.mjs
          node scripts/surface-menu-smoke.mjs
          node scripts/operation-help-smoke.mjs
          node scripts/export-preview-smoke.mjs
