name: Mobile smoke
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Chromium
        run: npx --yes --package=playwright@1.62.1 playwright install --with-deps chromium
      - name: Telefon, çizim ve OSM regresyonları
        run: npm run check:phone
      - name: Klavye, odak ve erişilebilirlik
        run: npm run check:accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-smoke
          path: /tmp/dendrogeo-mobile/
          retention-days: 7
