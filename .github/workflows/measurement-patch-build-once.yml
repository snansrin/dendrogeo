name: Measurement PATCH build and PGlite regression (one-shot)
on:
  push:
    branches: [fix/record-edit-minimal-cas-20261030]
permissions:
  contents: write
jobs:
  build-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - name: Verify atomic edit behavior on PostgreSQL before building
        run: |
          node --test test/measurement-update-regression.test.mjs test/field-compass-measurement-edit.test.mjs test/measurement-persistence-modules.test.mjs test/offline-sync-modules.test.mjs test/system-audit-persistence.test.mjs test/audit-reliability-regressions.test.mjs
      - name: Generate and commit only runtime and index
        shell: bash
        run: |
          set -euo pipefail
          npm run check:core-foundation
          npm run build
          unexpected="$(git diff --name-only | grep -v -E '^(index\.html|src/bootstrap/app-runtime\.js)$' || true)"
          if [ -n "$unexpected" ]; then printf '%s\n' "$unexpected" >&2; exit 1; fi
          git config user.name 'DendroGeo Build Bot'
          git config user.email 'bot@dendrogeo.local'
          git rm -- .github/workflows/measurement-patch-build-once.yml
          git add -- index.html src/bootstrap/app-runtime.js
          git diff --cached --quiet && exit 1
          git commit -m 'build(measurement): regenerate patched editor runtime'
          git push origin HEAD:fix/record-edit-minimal-cas-20261030
