name: UI Branch Build
on:
  push:
    branches:
      - ui/field-help-live-polish
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Commit generated index
        run: |
          git config user.name "DendroGeo QA Bot"
          git config user.email "qa@dendrogeo.local"
          git add index.html
          if git diff --cached --quiet; then
            echo "index current"
          else
            git commit -m "build: refresh index for field UI polish"
            git push origin HEAD:ui/field-help-live-polish
          fi
      - run: npm run check
