name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 0013 (2026-09-28 · kullanıcı: "GitHub'ın keyfini bekleyemem"): schedule
  # pratikte düzensiz tetikleniyor (20 saatte 4 koşu gözlendi) → yayın/geri
  # çekme kuyruğu HER PUSH'TA da boşaltılır. dogrula ile PARALEL koşar (test
  # sonucunu BEKLEMEZ: kuyruk işi kendi başına buyruktur, rapor-yayin.yml
  # ile aynı concurrency grubunda sıraya girer → çift koşu çakışmaz).
  kuyruk:
    name: Rapor kuyruğu (push tetiği)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DG_REPORT_READER: oidc
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: write
      actions: write   # 0016: kalp atışı zinciri
    concurrency:
      group: rapor-yayin-kuyrugu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıklar (npm ci)
        run: npm ci

      - name: Özel yayın okuyucusu OIDC sağlık kontrolü
        run: node scripts/report-reader-health.mjs --verify

      - name: Bekleyen yayın/geri çekme isteklerini işle
        run: node scripts/publish-queue.mjs

      - name: PDF ve DOI dosya paketlerini üret
        run: node scripts/render-report-pdf.mjs

      - name: Otomatik Zenodo DOI kaydı
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: node scripts/register-pending-dois.mjs

      - name: Yayınla (commit + push)
        if: always()
        run: |
          git config user.name "DendroGeo Rapor Bot"
          git config user.email "bot@dendrogeo.local"
          git add rapor/
          if git diff --cached --quiet; then
            echo "✅ Kuyruk boş — commit atlandı."
            exit 0
          fi
          git commit -m "docs(rapor): site içi yayın kuyruğu işlendi"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "✅ Yayın push edildi (deneme $i)."
              exit 0
            fi
            echo "⚠ push denemesi $i başarısız — 10 sn sonra yeniden."; sleep 10
          done
          echo "🔴 Rapor üretildi ama push edilemedi; sonraki koşu yeniden dener."
          exit 1

      # 0017 · zincir: kalp atışını ANLIK tetikle (delayed dispatch bu depoda
      # hiç koşmadı; repository_dispatch saniyeler içinde koşar — kanıtlı).
      # Kalp, kendi bekçili döngüsüyle zinciri tekilleştirip sürdürür.
      # 0028: repository_dispatch GITHUB_TOKEN'lu koşularda sessizce düşüyor
      # → bayrak artık workflow_dispatch ile tetiklenir (kanıtlı bacak).
      # 0029 · DERS: tırnaksız YAML skalerinde ": " (iki nokta+boşluk) mapping
      # hatasıdır → dosya GitHub'da HİÇ çözümlenmez, koşular "startup failure"
      # olur (0028 bu adımda ci.yml + rapor-yayin.yml'i kırdı; kuyruk 1 saat
      # bekledi). Ad değeri içinde ":" geçecekse DEĞER TIRNAKLI yazılır ve
      # test/workflow-yaml.test.mjs bunu her koşuda denetler.
      - name: "Kalp atışını başlat (0017 · 0028: workflow_dispatch)"
        if: always()
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/rapor-bayrak.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "🔗 kalp atışı tetiklendi (bayrak · workflow_dispatch)" \
            || echo "⚠ kalp tetiği gönderilemedi — cron/push yedeği devralır"

  dogrula:
    name: Sözdizimi + CSP + testler + dağıtım denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # node --check KULLANILMIYOR: .js dosyalarını CommonJS saydığı için
      # sloppy modda yasal olan yinelenen üst düzey function bildirimlerinde
      # yanlış pozitif üretiyor. vm.Script klasik <script> gibi ayrıştırır.
      # 0012: qrcode devDependency — kilit dosyasından deterministik kurulum.
      # (Bu adım olmadan `npm test` make-report'un qrcode import'unda patlıyordu.)
      - name: Bağımlılıklar (npm ci)
        run: npm ci

      # User-approved surface baseline: any source drift fails the PR build.
      - name: Korunan yüzey motoru bütünlük kilidi
        run: node scripts/check-surface-lock.mjs

      - name: Sözdizimi denetimi (tarayıcı semantiği)
        run: npm run check:syntax

      # ?v= numaraları içerik hash'i olmalı; elle artırma unutulan/kaçan
      # numaralar yüzünden repo ile canlı site iki kez ayrıştı.
      - name: Sürüm numarası tutarlılığı
        run: npm run check:versions

      # index.html bir ARTİFAKTTIR: partials/{head,landing,shell,boot}.html
      # birleşiminden üretilir. Elle index.html düzenlenirse bu adım yakalar
      # (düzeltme: npm run build ya da build-index.mjs --split).
      - name: Derleme tutarlılığı (index.html == partials)
        run: npm run build:check

      # Koda yeni dış servis eklenip CSP güncellenmezse istek tarayıcı
      # tarafından sessizce kesilir. Bu daha önce planetarycomputer.microsoft.com
      # ve titiler.terrascope.be ile yaşandı (a5dabbc ile düzeltildi).
      - name: CSP tutarlılığı
        run: npm run check:csp

      # Allometri, geometri, LULC motoru (UTM + alan korunumu) ve SW cache
      # stratejisi. Bilimsel çıktıyı üreten matematik burada kilitli.
      - name: Birim testler
        run: npm test

      # Yayındaki dosyalar depoyla aynı mı? Elle ?v= artırma + doğrudan main→Pages
      # akışında canlı sürüm ile depo iki kez ayrıştı (?v=90 vs ?v=84, ?v=97 vs
      # ?v=96). Bu adım o soruyu her dağıtımda cevaplar.
      - name: Dağıtım sürüklenme denetimi
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request, sys, time, re
          # Liste ELLE tutulmuyor: index.html'deki tüm src/css/vendor varlıkları
          # + çekirdek dosyalardan TÜRETİLİYOR. Yeni modül eklenince bu denetim
          # onu kendiliğinden kapsar (unutulma devri bitti).
          html = open('index.html', encoding='utf-8').read()
          dosyalar = ['index.html', 'sw.js', 'manifest.json']
          for m in re.finditer(r'(?:src|href)="((?:src|css|vendor)/[^"?]+)', html):
              if m.group(1) not in dosyalar:
                  dosyalar.append(m.group(1))
          h = lambda b: hashlib.sha256(b).hexdigest()[:16]
          sapma = []
          for d in dosyalar:
              yerel = h(open(d, 'rb').read())
              try:
                  istek = urllib.request.Request(
                      'https://dendrogeo.org/' + d + '?_=' + str(int(time.time())),
                      headers={'User-Agent': 'dendrogeo-ci-drift'})
                  canli = h(urllib.request.urlopen(istek, timeout=30).read())
              except Exception as e:
                  print(f'  ⚠️  {d}: erişilemedi ({e})'); continue
              ayni = yerel == canli
              print(f'  {"✅" if ayni else "🔴 SAPMA"} {d}  depo:{yerel} canlı:{canli}')
              if not ayni: sapma.append(d)
          print()
          if sapma:
              print('🔴 Canlı site depodan farklı:', ', '.join(sapma))
              print('   GitHub Pages dağıtımı 1-2 dk gecikmiş olabilir (bu adım')
              print('   continue-on-error ile çalışıyor) ya da push edilmemiş bir')
              print('   çalışma ağacından dağıtım yapılmış olabilir.')
              sys.exit(1)
          print('✅ Canlı site depoyla birebir aynı.')
          PY

  one_file_menu_water_evidence_builder:
    name: Original single File menu and targeted Sentinel shoreline full QA
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/single-file-menu-targeted-water-evidence-20261008'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-file-menu-targeted-water-evidence-20261008
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Build index and run complete locked-source CI suite
        run: |
          npm run build
          npm run check
      - name: Restore workflow and push only versioned asset references
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add index.html .github/workflows/ci.yml
          git config user.name "DendroGeo GIS QA"
          git config user.email "gis-ui-repair@users.noreply.github.com"
          git commit -m "build(gis): update one-File PNG and targeted evidence asset hashes"
          git pull --rebase origin fix/single-file-menu-targeted-water-evidence-20261008
          git push origin HEAD:fix/single-file-menu-targeted-water-evidence-20261008
