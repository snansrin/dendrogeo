name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dogrula:
    name: Sözdizimi + CSP + testler + dağıtım denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # node --check KULLANILMIYOR: .js dosyalarını CommonJS saydığı için
      # sloppy modda yasal olan yinelenen üst düzey function bildirimlerinde
      # yanlış pozitif üretiyor. vm.Script klasik <script> gibi ayrıştırır.
      - name: Sözdizimi denetimi (tarayıcı semantiği)
        run: npm run check:syntax

      # ?v= numaraları içerik hash'i olmalı; elle artırma unutulan/kaçan
      # numaralar yüzünden repo ile canlı site iki kez ayrıştı.
      - name: Sürüm numarası tutarlılığı
        run: npm run check:versions

      # index.html bir ARTİFAKTTIR: partials/{head,landing,shell,boot}.html
      # birleşiminden üretilir. Elle index.html düzenlenirse bu adım yakalar
      # (düzeltme: npm run build ya da build-index.mjs --split).
      - name: Derleme tutarlılığı (index.html == partials)
        run: npm run build:check

      # Koda yeni dış servis eklenip CSP güncellenmezse istek tarayıcı
      # tarafından sessizce kesilir. Bu daha önce planetarycomputer.microsoft.com
      # ve titiler.terrascope.be ile yaşandı (a5dabbc ile düzeltildi).
      - name: CSP tutarlılığı
        run: npm run check:csp

      # Allometri, geometri, LULC motoru (UTM + alan korunumu) ve SW cache
      # stratejisi. Bilimsel çıktıyı üreten matematik burada kilitli.
      - name: Birim testler
        run: npm test

      # Yayındaki dosyalar depoyla aynı mı? Elle ?v= artırma + doğrudan main→Pages
      # akışında canlı sürüm ile depo iki kez ayrıştı (?v=90 vs ?v=84, ?v=97 vs
      # ?v=96). Bu adım o soruyu her dağıtımda cevaplar.
      - name: Dağıtım sürüklenme denetimi
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request, sys, time, re
          # Liste ELLE tutulmuyor: index.html'deki tüm src/css/vendor varlıkları
          # + çekirdek dosyalardan TÜRETİLİYOR. Yeni modül eklenince bu denetim
          # onu kendiliğinden kapsar (unutulma devri bitti).
          html = open('index.html', encoding='utf-8').read()
          dosyalar = ['index.html', 'sw.js', 'manifest.json']
          for m in re.finditer(r'(?:src|href)="((?:src|css|vendor)/[^"?]+)', html):
              if m.group(1) not in dosyalar:
                  dosyalar.append(m.group(1))
          h = lambda b: hashlib.sha256(b).hexdigest()[:16]
          sapma = []
          for d in dosyalar:
              yerel = h(open(d, 'rb').read())
              try:
                  istek = urllib.request.Request(
                      'https://dendrogeo.org/' + d + '?_=' + str(int(time.time())),
                      headers={'User-Agent': 'dendrogeo-ci-drift'})
                  canli = h(urllib.request.urlopen(istek, timeout=30).read())
              except Exception as e:
                  print(f'  ⚠️  {d}: erişilemedi ({e})'); continue
              ayni = yerel == canli
              print(f'  {"✅" if ayni else "🔴 SAPMA"} {d}  depo:{yerel} canlı:{canli}')
              if not ayni: sapma.append(d)
          print()
          if sapma:
              print('🔴 Canlı site depodan farklı:', ', '.join(sapma))
              print('   GitHub Pages dağıtımı 1-2 dk gecikmiş olabilir (bu adım')
              print('   continue-on-error ile çalışıyor) ya da push edilmemiş bir')
              print('   çalışma ağacından dağıtım yapılmış olabilir.')
              sys.exit(1)
          print('✅ Canlı site depoyla birebir aynı.')
          PY
