name: Waypoint Build Sync
on:
  push:
    branches:
      - fix/waypoint-mobile-status
permissions:
  contents: write
jobs:
  build-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Commit generated index
        run: |
          git config user.name "DendroGeo QA Bot"
          git config user.email "qa@dendrogeo.local"
          git add index.html
          if git diff --cached --quiet; then
            echo "index current"
          else
            git commit -m "build: refresh index for mobile waypoint"
            git push origin HEAD:fix/waypoint-mobile-status
          fi
