name: Field fix generated assets (one-shot)
on:
  push:
    branches: [fix/field-compass-measurement-edit-20261030]
permissions:
  contents: write
jobs:
  build-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Regenerate only runtime and index
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          git status --short
          unexpected="$(git diff --name-only | grep -v -E '^(index\.html|src/bootstrap/app-runtime\.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "ERROR: unexpected generated changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name 'DendroGeo Build Bot'
          git config user.email 'bot@dendrogeo.local'
          git rm -- .github/workflows/field-fix-build.yml
          git add -- index.html src/bootstrap/app-runtime.js
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No generated assets changed.'
            exit 1
          fi
          git commit -m 'build(field): regenerate runtime and index from verified modules'
          git push origin HEAD:fix/field-compass-measurement-edit-20261030
