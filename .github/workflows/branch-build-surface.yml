name: Surface branch artifact finalize

on:
  push:
    branches: [fix/surface-report-field-ux]

permissions:
  contents: write

concurrency:
  group: surface-field-artifact-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surface-report-field-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Scope historical migration guards to their release cutoff
        run: |
          python - <<'PY'
          from pathlib import Path
          cutoff = '20261003165331_surface_reviews.sql'
          for name in ['test/dbh-qa.test.mjs', 'test/form-qa.test.mjs']:
            p = Path(name)
            lines = p.read_text(encoding='utf-8').splitlines()
            if any('migAtCutoff' in line for line in lines):
              continue
            for i, line in enumerate(lines):
              if 'for (const f of mig) assert.ok((parseInt(f.slice(0, 4), 10) <= 25' in line:
                indent = line[:len(line) - len(line.lstrip())]
                guard = line.replace('for (const f of mig)', 'for (const f of migAtCutoff)', 1)
                lines[i:i+1] = [
                  indent + "const migAtCutoff = mig.filter((f) => !/^\\d{14}_/.test(f) || f <= '" + cutoff + "');",
                  guard,
                ]
                p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
                break
            else:
              raise SystemExit(f'historical migration guard not found: {name}')
          PY
      - name: Refresh content hashes and generated index
        run: |
          node scripts/version-sync.mjs --write
          npm run build
      - name: Validate generated artifacts and affected feature tests
        run: |
          npm run check:syntax
          npm run check:versions
          npm run build:check
          npm run check:csp
          node --test test/surface-report-field-ux.test.mjs test/surface-review.test.mjs
          node --test test/lazylibs.test.mjs test/load-order.test.mjs test/module-registry.test.mjs test/sw-cache.test.mjs
          node --test test/publish-request-fix.test.mjs test/rapor.test.mjs test/report-publish.test.mjs test/report-v2.test.mjs test/user-publish.test.mjs
      - name: Commit generated artifacts
        run: |
          git config user.name "DendroGeo Branch Build"
          git config user.email "bot@dendrogeo.local"
          git add index.html src/utils/lazylibs.js src/ui/toast.js test/dbh-qa.test.mjs test/form-qa.test.mjs
          if git diff --cached --quiet; then
            echo "Artifacts already current"
            exit 0
          fi
          git commit -m "build: finalize surface field artifacts"
          git push origin HEAD:fix/surface-report-field-ux
