name: Surface field branch build

on:
  push:
    branches: [fix/surface-report-field-ux]

permissions:
  contents: write

concurrency:
  group: surface-field-branch-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surface-report-field-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Varlık hashlerini içerikle eşitle
        run: node scripts/version-sync.mjs --write
      - name: Üretilen index/hash dosyasını güncelle
        run: npm run build
      - name: Sözdizimi denetimi
        run: npm run check:syntax
      - name: Sürüm denetimi
        run: npm run check:versions
      - name: Build tutarlılığı
        run: npm run build:check
      - name: CSP tutarlılığı
        run: npm run check:csp
      - name: Yeni yüzey + saha testi
        continue-on-error: true
        run: node --test test/surface-report-field-ux.test.mjs test/surface-review.test.mjs
      - name: LULC ve geometri test grubu
        continue-on-error: true
        run: node --test test/landcover.test.mjs test/landcover-v4.test.mjs test/lc-validate.test.mjs test/geometry.test.mjs test/map-refresh.test.mjs test/geofence.test.mjs
      - name: Envanter ve hesap test grubu
        continue-on-error: true
        run: node --test test/allometry.test.mjs test/dbh-qa.test.mjs test/form-qa.test.mjs test/inventory-qa.test.mjs test/photo-qa.test.mjs test/truncation.test.mjs
      - name: Park ve saha akış test grubu
        continue-on-error: true
        run: node --test test/measure-field.test.mjs test/waypoint-field.test.mjs test/park-flow.test.mjs test/park-identity.test.mjs test/park-invites.test.mjs test/heartbeat.test.mjs
      - name: UI auth ve uygunluk test grubu
        continue-on-error: true
        run: node --test test/google-auth.test.mjs test/landing-claims.test.mjs test/ui-audit.test.mjs test/ui-standard.test.mjs test/vendor-globals.test.mjs test/compliance.test.mjs test/critical-fixes.test.mjs
      - name: Rapor ve release test grubu
        continue-on-error: true
        run: node --test test/publish-request-fix.test.mjs test/rapor.test.mjs test/report-author-qr.test.mjs test/report-publish.test.mjs test/report-v2.test.mjs test/user-publish.test.mjs test/retraction.test.mjs test/release.test.mjs test/restore-ci.test.mjs
      - name: Yapı yükleme ve SW test grubu
        continue-on-error: true
        run: node --test test/admin-tree.test.mjs test/build-consistency.test.mjs test/fix-0043.test.mjs test/fix-0045.test.mjs test/lazylibs.test.mjs test/load-order.test.mjs test/module-registry.test.mjs test/sw-cache.test.mjs test/workflow-yaml.test.mjs
      - name: Tüm birim testleri
        run: npm test
      - name: Build artifactını branch'e yaz
        run: |
          git config user.name "DendroGeo Branch Build"
          git config user.email "bot@dendrogeo.local"
          git add index.html
          if git diff --cached --quiet; then
            echo "✅ index.html zaten güncel"
            exit 0
          fi
          git commit -m "build: refresh generated index hashes"
          git push origin HEAD:fix/surface-report-field-ux
