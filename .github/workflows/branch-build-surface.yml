name: Surface field branch build

on:
  push:
    branches: [fix/surface-report-field-ux]

permissions:
  contents: write

concurrency:
  group: surface-field-branch-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surface-report-field-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Varlık hashlerini içerikle eşitle
        run: node scripts/version-sync.mjs --write
      - name: Üretilen index/hash dosyasını güncelle
        run: npm run build
      - name: Sözdizimi denetimi
        run: npm run check:syntax
      - name: Sürüm denetimi
        run: npm run check:versions
      - name: Build tutarlılığı
        run: npm run build:check
      - name: CSP tutarlılığı
        run: npm run check:csp
      - name: Yeni yüzey + saha testi
        continue-on-error: true
        run: node --test test/surface-report-field-ux.test.mjs
      - name: Yüzey inceleme testleri
        continue-on-error: true
        run: node --test test/surface-review.test.mjs
      - name: Lazy ve yükleme testleri
        continue-on-error: true
        run: node --test test/lazylibs.test.mjs test/load-order.test.mjs test/module-registry.test.mjs
      - name: Rapor yayın testleri
        continue-on-error: true
        run: node --test test/publish-request-fix.test.mjs test/rapor.test.mjs test/report-publish.test.mjs test/report-v2.test.mjs test/user-publish.test.mjs test/retraction.test.mjs
      - name: SW ve workflow testleri
        continue-on-error: true
        run: node --test test/sw-cache.test.mjs test/workflow-yaml.test.mjs
      - name: Tüm birim testleri
        run: npm test
      - name: Build artifactını branch'e yaz
        run: |
          git config user.name "DendroGeo Branch Build"
          git config user.email "bot@dendrogeo.local"
          git add index.html
          if git diff --cached --quiet; then
            echo "✅ index.html zaten güncel"
            exit 0
          fi
          git commit -m "build: refresh generated index hashes"
          git push origin HEAD:fix/surface-report-field-ux
