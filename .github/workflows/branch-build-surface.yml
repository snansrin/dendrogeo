name: Surface field branch build

on:
  push:
    branches: [fix/surface-report-field-ux]

permissions:
  contents: write

concurrency:
  group: surface-field-branch-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surface-report-field-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Tarihsel QA migration kilitlerini dönem kesimine bağla
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
            'test/dbh-qa.test.mjs': (
              "    for (const f of mig) assert.ok((parseInt(f.slice(0, 4), 10) <= 25 || f === \"20261003165331_surface_reviews.sql\"), '0031 yeni migration EKLEMEMELİ: ' + f);",
              "    const migAt0031 = mig.filter((f) => !/^\\d{14}_/.test(f) || f <= '20261003165331_surface_reviews.sql');\n    for (const f of migAt0031) assert.ok((parseInt(f.slice(0, 4), 10) <= 25 || f === \"20261003165331_surface_reviews.sql\"), '0031 döneminde beklenmeyen migration: ' + f);"
            ),
            'test/form-qa.test.mjs': (
              "    for (const f of mig) assert.ok((parseInt(f.slice(0, 4), 10) <= 25 || f === \"20261003165331_surface_reviews.sql\"), '0033 yeni migration EKLEMEMELİ: ' + f);",
              "    const migAt0033 = mig.filter((f) => !/^\\d{14}_/.test(f) || f <= '20261003165331_surface_reviews.sql');\n    for (const f of migAt0033) assert.ok((parseInt(f.slice(0, 4), 10) <= 25 || f === \"20261003165331_surface_reviews.sql\"), '0033 döneminde beklenmeyen migration: ' + f);"
            ),
          }
          for name, (old, new) in patches.items():
            p = Path(name)
            text = p.read_text(encoding='utf-8')
            if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
            elif new not in text:
              raise SystemExit(f'Beklenen QA kilidi bulunamadı: {name}')
          PY
      - name: Varlık hashlerini içerikle eşitle
        run: node scripts/version-sync.mjs --write
      - name: Üretilen index/hash dosyasını güncelle
        run: npm run build
      - name: Sözdizimi denetimi
        run: npm run check:syntax
      - name: Sürüm denetimi
        run: npm run check:versions
      - name: Build tutarlılığı
        run: npm run build:check
      - name: CSP tutarlılığı
        run: npm run check:csp
      - name: Test grupları
        run: |
          node --test test/surface-report-field-ux.test.mjs test/surface-review.test.mjs
          node --test test/landcover.test.mjs test/landcover-v4.test.mjs test/lc-validate.test.mjs test/geometry.test.mjs test/map-refresh.test.mjs test/geofence.test.mjs
          node --test test/allometry.test.mjs test/dbh-qa.test.mjs test/form-qa.test.mjs test/inventory-qa.test.mjs test/photo-qa.test.mjs test/truncation.test.mjs
          node --test test/measure-field.test.mjs test/waypoint-field.test.mjs test/park-flow.test.mjs test/park-identity.test.mjs test/park-invites.test.mjs test/heartbeat.test.mjs
          node --test test/google-auth.test.mjs test/landing-claims.test.mjs test/ui-audit.test.mjs test/ui-standard.test.mjs test/vendor-globals.test.mjs test/compliance.test.mjs test/critical-fixes.test.mjs
          node --test test/publish-request-fix.test.mjs test/rapor.test.mjs test/report-author-qr.test.mjs test/report-publish.test.mjs test/report-v2.test.mjs test/user-publish.test.mjs test/retraction.test.mjs test/release.test.mjs test/restore-ci.test.mjs
          node --test test/admin-tree.test.mjs test/build-consistency.test.mjs test/fix-0043.test.mjs test/fix-0045.test.mjs test/lazylibs.test.mjs test/load-order.test.mjs test/module-registry.test.mjs test/sw-cache.test.mjs test/workflow-yaml.test.mjs
      - name: Seri tam birim testleri
        run: node --test --test-concurrency=1 test/*.test.mjs
      - name: Mevcut paralel test komutu
        run: npm test
      - name: Doğrulanmış değişiklikleri branch'e yaz
        run: |
          git config user.name "DendroGeo Branch Build"
          git config user.email "bot@dendrogeo.local"
          git add index.html src/utils/lazylibs.js src/ui/toast.js test/dbh-qa.test.mjs test/form-qa.test.mjs
          if git diff --cached --quiet; then
            echo "✅ kaynaklar ve index zaten güncel"
            exit 0
          fi
          git commit -m "test: allow later migrations and refresh asset hashes"
          git push origin HEAD:fix/surface-report-field-ux
