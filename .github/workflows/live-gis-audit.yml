name: Live GIS Scientific Audit
on:
  push:
    branches:
      - audit/full-scan-20261006
permissions:
  contents: read
jobs:
  gis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Göksu live scientific chain
        run: timeout 900 node scripts/val-qa.mjs --park-id 25
