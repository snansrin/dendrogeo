name: Waypoint Branch QA
on:
  push:
    branches: [ui/waypoint-field-v2]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build generated index and version hashes
        run: npm run build
      - name: Commit generated index
        run: |
          git config user.name "DendroGeo QA Bot"
          git config user.email "qa@dendrogeo.local"
          git add index.html partials/head.html
          if git diff --cached --quiet; then
            echo "Generated files current."
          else
            git commit -m "build: refresh waypoint workspace artifacts"
            git push origin HEAD:ui/waypoint-field-v2
          fi
      - name: Full guard chain
        run: npm run check
