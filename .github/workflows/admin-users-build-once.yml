name: Admin Users Build Once
on:
  push:
    branches:
      - fix/circumference-to-dbh-protocol
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Commit generated index and remove one-shot workflow
        run: |
          git config user.name "DendroGeo Build Bot"
          git config user.email "build@dendrogeo.local"
          rm .github/workflows/admin-users-build-once.yml
          git add index.html .github/workflows/admin-users-build-once.yml
          if git diff --cached --quiet; then
            echo "No generated change"
            exit 0
          fi
          git commit -m "build: refresh index for compact user management"
          git push origin HEAD:fix/circumference-to-dbh-protocol
