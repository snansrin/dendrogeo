name: Projects UI Branch QA

on:
  push:
    branches:
      - feat/projects-ui-collab-roles

permissions:
  contents: write

jobs:
  qa:
    name: Full guard chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated index
        run: |
          git config user.name "DendroGeo QA Bot"
          git config user.email "qa@dendrogeo.local"
          git add index.html
          if git diff --cached --quiet; then
            echo "index current"
          else
            git commit -m "build: refresh index for projects UI"
            git push origin HEAD:feat/projects-ui-collab-roles
          fi
      - name: Full checks
        run: npm run check
