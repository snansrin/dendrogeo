[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dendrogeo-client"
version = "0.1.0"
description = "Read and verify publicly released DendroGeo scientific reports"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "DendroGeo contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

[tool.setuptools.packages.find]
where = ["src"]

